    # BEGIN FANQIANG DIAGNOSTICS v0.1.0
    # Cloudflare trusted ranges checked 2026-11-02:
    # https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/
    location ^~ /diagnostics-api/ {
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;
        real_ip_recursive on;
        proxy_pass http://127.0.0.1:8792/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Diagnostics-Client $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        client_body_timeout 5s;
        client_max_body_size 64k;
        gzip off;
        gzip_static off;
        access_log off;
        error_log /dev/null crit;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store, no-transform" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /diagnostics { return 301 /diagnostics/; }
    location ^~ /diagnostics/downloads/ {
        alias /srv/fanqiang-diagnostics/downloads/;
        autoindex off;
        gzip off;
        gzip_static off;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition attachment;
    }
    location ^~ /diagnostics/ {
        alias /opt/fanqiang-diagnostics/current/site/;
        index index.html;
        autoindex off;
        gzip_static off;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # END FANQIANG DIAGNOSTICS
