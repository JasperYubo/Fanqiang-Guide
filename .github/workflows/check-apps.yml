name: 校验网站与问答服务源码

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'export/**'
      - 'developer/**'
      - 'CLAUDE.md'
      - 'tools/ilang_grammar_validator.py'
      - '.github/workflows/check-apps.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'export/**'
      - 'developer/**'
      - 'CLAUDE.md'
      - 'tools/ilang_grammar_validator.py'
      - '.github/workflows/check-apps.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 读取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 准备 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: 准备 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: 安装查询服务测试依赖
        run: python -m pip install -r apps/lookup/runtime/requirements-lock.txt
      - name: 从仓库外运行完整构建校验
        working-directory: ${{ runner.temp }}
        env:
          PYTHONUTF8: '1'
        run: python "$GITHUB_WORKSPACE/developer/check_apps.py"
