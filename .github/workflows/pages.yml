name: 发布项目入口到 GitHub Pages
run-name: linux-sync:${{ inputs.sync_id }}:${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Linux 已验证并部署到主站的完整 Git commit SHA
        required: true
        type: string
      sync_id:
        description: Linux 持久同步事务 ID（同次重试保持不变）
        required: true
        type: string
      contract_sha256:
        description: 主站共享产品合同的规范 JSON SHA256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SYNC_ID: ${{ inputs.sync_id }}
      CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
    steps:
      - name: 读取 Linux 已验证的精确源码版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: 校验脚本语法与入口
        run: |
          python3 developer/sync_pages_contract.py --write
          python3 developer/sync_pages_contract.py --check
          test -s apps/pages/index.html
          test -s apps/pages/style.css
          node --check apps/pages/script.js
          python3 developer/check_pages_seo.py
      - name: 核对主站事务与精确版本
        run: python3 developer/check_pages_live_contract.py --source-sha "$SOURCE_SHA" --sync-id "$SYNC_ID" --contract-sha256 "$CONTRACT_SHA256"
      - name: 写入可公开核验的 Pages 发布收据
        run: python3 developer/release_receipt.py pages --source-sha "$SOURCE_SHA" --sync-id "$SYNC_ID" --contract-sha256 "$CONTRACT_SHA256" --public-dir apps/pages
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: 上传独立项目入口
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/pages
      - name: 发布前再次核对主站仍是同一事务
        run: python3 developer/check_pages_live_contract.py --source-sha "$SOURCE_SHA" --sync-id "$SYNC_ID" --contract-sha256 "$CONTRACT_SHA256"
      - name: 发布页面
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  server-acceptance:
    name: Linux 新安装和旧版升级验收
    if: ${{ inputs.source_sha != '270c81ba257398004ecf992d2cde2d3029d981de' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      report_sha256: ${{ steps.report.outputs.sha256 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: 读取本次候选源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 验证验收器与失败阻断规则
        run: |
          python3 -m unittest discover -s tests -p 'test_*release_acceptance.py' -q
          python3 -m unittest discover -s tests -p test_server_release_e2e.py -q
      - name: 在隔离 Linux 完整验收新安装及旧版升级
        # The scoped read token is consumed only for repository release metadata;
        # the harness removes it before starting any installer or fixture.
        env:
          HUARUN_BASELINE_GITHUB_TOKEN: ${{ github.token }}
        run: python3 developer/server_release_e2e.py --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/linux-install-upgrade-proof.json"
      - name: 绑定原始验收报告摘要
        id: report
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/linux-install-upgrade-proof.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: 保存本次运行的验收报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-install-upgrade-proof.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Linux 安装升级验收后自动发版
    # 已核验的既有回滚基线早于 Release 脚本；仅该精确旧版本免发版。
    # 其他版本缺少发布脚本仍须失败，不能把缺失当作可跳过。
    if: ${{ inputs.source_sha != '270c81ba257398004ecf992d2cde2d3029d981de' }}
    needs: [deploy, server-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SYNC_ID: ${{ inputs.sync_id }}
      CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
    steps:
      - name: 读取与双站一致的精确源码版本
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: 校验发布脚本与附件来源
        run: |
          python3 developer/sync_server_assistant.py --check
          python3 developer/sync_pages_contract.py --check
          python3 -m unittest discover -s tests -p test_github_release.py -q
          python3 -m unittest discover -s tests -p 'test_*release_acceptance.py' -q
          python3 -m unittest discover -s tests -p test_server_release_e2e.py -q
      - name: 读取同一运行和重试次数的验收报告
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-acceptance-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: 核对报告传递过程的原始字节
        env:
          REPORT_SHA256: ${{ needs.server-acceptance.outputs.report_sha256 }}
        run: |
          test "${#REPORT_SHA256}" -eq 64
          printf '%s  %s\n' "$REPORT_SHA256" "$RUNNER_TEMP/linux-install-upgrade-proof.json" | sha256sum --check --strict -
      - name: 核验双站并发布完整 GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 developer/publish_github_release.py --source-sha "$SOURCE_SHA" --sync-id "$SYNC_ID" --contract-sha256 "$CONTRACT_SHA256" --acceptance-report "$RUNNER_TEMP/linux-install-upgrade-proof.json"
